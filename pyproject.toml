[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyreactor-cli"
dynamic = ["version"]
description = "JHipster-inspired full-stack generator for Python (FastAPI/Django/Flask) + React"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
  {name = "Panagiotis Adamopoulos", email = "info@assert.gr"},
]
keywords = ["generator", "scaffolding", "fastapi", "react", "fullstack", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Code Generators",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "click>=8.1.7",
  "rich>=13.7.0",
  "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
pyreactor = "pyreactor.cli:cli"

[project.urls]
Homepage = "https://github.com/panosadamop/pyreactor"
Repository = "https://github.com/panosadamop/pyreactor"
Issues = "https://github.com/panosadamop/pyreactor/issues"

[tool.setuptools.dynamic]
version = {attr = "pyreactor.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["pyreactor*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
